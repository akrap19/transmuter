[package]
name = "transmuter-registry"
version = "0.1.0"
description = "Registry shim: empty council, streaming-decodable config prefix"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "transmuter_registry"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
transmuter-constants = { path = "../../crates/transmuter-constants" }

[package.metadata.solana]
tools-version = "v1.52"
