[package]
name = "transmuter-eol-token"
version = "0.1.0"
description = "EOL Token: USDC sale, finalize gates, convertTreasury, fees, reserve mint, liquidation"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "transmuter_eol_token"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = [
    "anchor-lang/idl-build",
    "anchor-spl/idl-build",
    "mock-dex/idl-build",
    "transmuter-ctoken/idl-build",
    "transmuter-vesting/idl-build",
    "transmuter-runway-escrow/idl-build",
    "transmuter-staking/idl-build",
]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.1", features = ["token_2022", "token_2022_extensions"] }
mock-dex = { path = "../mock_dex", features = ["cpi"] }
transmuter-constants = { path = "../../crates/transmuter-constants" }
transmuter-ctoken = { path = "../transmuter_ctoken", features = ["cpi"] }
transmuter-vesting = { path = "../transmuter_vesting", features = ["cpi"] }
transmuter-runway-escrow = { path = "../transmuter_runway_escrow", features = ["cpi"] }
transmuter-staking = { path = "../transmuter_staking", features = ["cpi"] }

[package.metadata.solana]
tools-version = "v1.52"
