[package]
name = "transmuter-vesting"
version = "0.1.0"
description = "Team/investor EOL vesting: two pots, one TEAM entry, liquidation write-down burn"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "transmuter_vesting"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = "0.32.1"
transmuter-constants = { path = "../../crates/transmuter-constants" }

[package.metadata.solana]
tools-version = "v1.52"
