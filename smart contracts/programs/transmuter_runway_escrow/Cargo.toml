[package]
name = "transmuter-runway-escrow"
version = "0.1.0"
description = "USDC runway escrow: fund/draw, halt/resume/advance, liquidation return to treasury"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "transmuter_runway_escrow"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = "0.32.1"
transmuter-constants = { path = "../../crates/transmuter-constants" }

[package.metadata.solana]
tools-version = "v1.52"
