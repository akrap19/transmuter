[package]
name = "mock-pyth"
version = "0.1.0"
description = "Mock Pyth feed: settable price, confidence, timestamp"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mock_pyth"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
transmuter-constants = { path = "../../crates/transmuter-constants" }

[package.metadata.solana]
tools-version = "v1.52"
